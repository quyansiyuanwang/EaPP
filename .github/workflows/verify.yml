name: verify

on:
  push:
    branches: [main]
  pull_request:

# The project's definition of "green" is exactly one command: `pnpm run verify`.
# CI cannot diverge from what a contributor runs locally, so there is nothing here
# that is not also in that command.
#
# Go is needed because the last segment runs the independent Go implementation
# through the language-neutral harness: 33 checks against each of two
# implementations, where the harness imports nothing from either.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache-dependency-path`: the Go module has no dependencies, so there is
      # no go.sum to key a cache on. Standard library only, on purpose.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The independent implementation, on its own terms
        working-directory: implementations/go
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Verify everything
        run: pnpm run verify
